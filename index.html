<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DefogDaily | Find out exactly where your mind is weak</title>
    <meta name="description" content="Free cognitive assessment across 8 domains. A real diagnostic report — percentiles, reaction-time consistency, interference cost, impulsivity — plus a 28-day training protocol built from your weakest result. No account needed." />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DefogDaily" />
    <meta property="og:url" content="https://defogdaily.com/" />
    <meta property="og:title" content="DefogDaily | Find out exactly where your mind is weak" />
    <meta property="og:description" content="8 cognitive domains measured trial by trial. A real diagnostic report, and a 28-day protocol to fix your weakest one. Free, forever, no signup." />
    <meta property="og:image" content="https://defogdaily.com/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DefogDaily | Find out exactly where your mind is weak" />
    <meta name="twitter:description" content="8 cognitive domains measured trial by trial. A real diagnostic report, and a 28-day protocol to fix your weakest one. Free, forever, no signup." />
    <meta name="twitter:image" content="https://defogdaily.com/og-image.png" />

    <!-- PWA touches -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B0E14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG for the home-screen icon and would fall back to a
         screenshot, so a real PNG is required here. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DefogDaily" />

    <!--
      Fonts are self-hosted via @fontsource and imported from src/index.css, so
      no request leaves this origin and nothing here blocks first paint.
    -->
  </head>
  <body class="bg-bg-base text-text-primary antialiased"> 
    <div id="root">
      <div style="display: flex; height: 100vh; align-items: center; justify-content: center;">
        <div style="width: 32px; height: 32px; border: 2px solid rgba(255,255,255,0.1); border-top-color: #3ED9D5; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
